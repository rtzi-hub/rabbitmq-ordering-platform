apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kibana-secret-manager
  namespace: logging
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["kibana-kibana-es-token"]
  verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kibana-secret-manager
  namespace: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kibana-secret-manager
subjects:
- kind: ServiceAccount
  name: kibana
  namespace: logging
