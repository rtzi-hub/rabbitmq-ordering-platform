apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: grafana-dashboards
    files:
      - dashboards/
generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  grafana_dashboard: "1"
commonAnnotations:
  grafana_folder: CompanyDashboards
