apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: grafana-dashboards
    files:
      - k8s-platform.json
      - postgres.json
      - rabbitmq.json
      - vm-node.json
generatorOptions:
  disableNameSuffixHash: true

commonLabels:
  grafana_dashboard: "1"
commonAnnotations:
  grafana_folder: CompanyDashboards
