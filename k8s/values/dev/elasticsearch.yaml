replicas: 1
clusterName: "elasticsearch"
minimumMasterNodes: 1
roles:
  - master
  - data
  - ingest

protocol: https
createCert: true

persistence:
  enabled: false

esJavaOpts: "-Xms512m -Xmx512m"

resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

antiAffinity: "soft"
sysctlInitContainer:
  enabled: true
sysctlVmMaxMapCount: 262144

secret:
  enabled: false
extraEnvs:
  - name: ELASTIC_USERNAME
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: username
  - name: ELASTIC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: elasticsearch-master-credentials
        key: password

clusterHealthCheckParams: "wait_for_status=yellow&timeout=60s"
readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 30

esConfig:
  elasticsearch.yml: |
    discovery.type: single-node
